server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: product-service
    instance-id: ${INSTANCE_ID:instance-1}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    instance-id: ${spring.application.instance-id}
    prefer-ip-address: true